<dialog id="add-user-dialog" class="sheet">
  <form method="dialog" class="sheet-card" id="add-user-form">
    <div class="sheet-header">
      <div>
        <h2>Add a user</h2>
        <p class="muted">Create a new user account.</p>
      </div>
      <button type="button" class="icon-btn" data-close-dialog aria-label="Close">×</button>
    </div>
    <div class="stack">
      <label class="field"><span>Name</span><input name="name" required></label>
      <label class="field"><span>Email</span><input type="email" name="email" required placeholder="name@example.com"></label>
      <label class="field"><span>Password</span><input type="password" name="password" required placeholder="Min 8 chars, upper, lower, number"></label>
      <div class="field">
        <span>Role</span>
        <div class="role-picker">
          <label class="role-option">
            <input type="radio" name="role" value="user" checked>
            <span class="role-option-label">User</span>
          </label>
          <label class="role-option">
            <input type="radio" name="role" value="admin">
            <span class="role-option-label">Admin</span>
          </label>
        </div>
      </div>
      <label class="checkbox-field">
        <input type="checkbox" name="autoVerify">
        <span>Auto-verify email</span>
      </label>
      <p id="add-user-error" class="form-error hidden"></p>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn btn-ghost" data-close-dialog>Cancel</button>
      <button type="submit" class="btn btn-primary">Create user</button>
    </div>
  </form>
</dialog>

<dialog id="ban-user-dialog" class="sheet">
  <form method="dialog" class="sheet-card" id="ban-user-form">
    <input type="hidden" name="userId">
    <div class="sheet-header">
      <div>
        <h2>Ban user</h2>
        <p class="muted">Restrict this user's access to the application.</p>
      </div>
      <button type="button" class="icon-btn" data-close-dialog aria-label="Close">×</button>
    </div>
    <div class="stack">
      <label class="field"><span>Reason</span><textarea name="banReason" rows="3" placeholder="Spamming"></textarea></label>
      <label class="field"><span>Duration</span>
        <select name="banDuration">
          <option value="1">1 day</option>
          <option value="3">3 days</option>
          <option value="7" selected>7 days</option>
          <option value="14">14 days</option>
          <option value="30">30 days</option>
          <option value="90">90 days</option>
          <option value="permanent">Permanent</option>
        </select>
      </label>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn btn-ghost" data-close-dialog>Cancel</button>
      <button type="submit" class="btn btn-danger">Ban user</button>
    </div>
  </form>
</dialog>

<dialog id="role-user-dialog" class="sheet">
  <form method="dialog" class="sheet-card" id="role-user-form">
    <input type="hidden" name="userId">
    <div class="sheet-header">
      <div>
        <h2>Update role</h2>
        <p class="muted">Change this user's role.</p>
      </div>
      <button type="button" class="icon-btn" data-close-dialog aria-label="Close">×</button>
    </div>
    <div class="field">
      <span>Role</span>
      <div class="role-picker">
        <label class="role-option">
          <input type="radio" name="role" value="user">
          <span class="role-option-label">User</span>
        </label>
        <label class="role-option">
          <input type="radio" name="role" value="admin">
          <span class="role-option-label">Admin</span>
        </label>
      </div>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn btn-ghost" data-close-dialog>Cancel</button>
      <button type="submit" class="btn btn-primary">Save role</button>
    </div>
  </form>
</dialog>

<dialog id="delete-user-dialog" class="sheet">
  <form method="dialog" class="sheet-card" id="delete-user-form">
    <input type="hidden" name="userId">
    <div class="sheet-header">
      <div>
        <h2>Delete user</h2>
        <p class="muted">This action cannot be undone.</p>
      </div>
      <button type="button" class="icon-btn" data-close-dialog aria-label="Close">×</button>
    </div>
    <p id="delete-user-message" class="muted delete-user-message"></p>
    <div class="sheet-actions">
      <button type="button" class="btn btn-ghost" data-close-dialog>Cancel</button>
      <button type="submit" class="btn btn-danger">Delete user</button>
    </div>
  </form>
</dialog>
